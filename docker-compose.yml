# Compose file for Deen 音乐下载器
#
# 用法：
#   docker compose up -d
#   浏览器打开 http://<host-ip>:45600
#
# 安全提示：本服务没有登录（v0.9.0.0 起）。下面的端口映射会把服务暴露给宿主机
# 所在网络的所有人（可导出/修改账号 Cookie、删除下载目录内文件）。请至少做一项：
#   - 设置 ACCESS_TOKEN（下方 environment 段），首次访问 http://<host-ip>:45600/?token=<令牌>
#   - 或把端口映射改为 "127.0.0.1:45600:45600"，只允许宿主机本机访问
#
# 数据持久化：
#   - /data：SQLite（账号/歌单/任务/设置） + 日志 + ncm-api 临时缓存
#   - /app/downloads（或挂载到任意宿主机路径）：下载的音乐文件
#   - /app/logs 日志文件（webapp.log）其他日志在/data目录
#
# 高级用法：
#   - 改端口：编辑下方 ports 映射，或通过环境变量 WEB_PORT=0.0.0.0:45601 改容器内监听地址
#     （WEB_PORT 优先于数据库里的 web_port 设置，不写库；容器内必须监听 0.0.0.0）
#   - 改时区：通过 TZ 环境变量传入（容器默认 UTC；设 TZ=Asia/Shanghai 让日志/任务调度
#     使用本地时间）
#   - 升级镜像：docker compose pull && docker compose up -d
#   - 自定义源：build.args 段传入 APT_MIRROR / PIP_INDEX_URL，海外用户可设回
#     APT_MIRROR=deb.debian.org  PIP_INDEX_URL=https://pypi.org/simple

name: deen-music-downloader

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # 镜像源：默认走国内源（apt 阿里云 / pip 阿里云）以加速国内构建。
      # 海外用户改成下面注释里的值即可恢复官方源：
      args:
        APT_MIRROR: mirrors.aliyun.com
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple
        # APT_MIRROR: deb.debian.org
        # PIP_INDEX_URL: https://pypi.org/simple
    image: chongya369/deen-music-downloader:latest
    container_name: deen-music-downloader
    restart: unless-stopped

    # Web UI: 宿主机 :45600 → 容器 :45600
    # 端口映射采用短语法；如需绑定到特定宿主机 IP，请改为 "127.0.0.1:45600:45600"。
    # 未设置 ACCESS_TOKEN 时，局域网内任何人都能访问本服务（见文件头安全提示）。
    ports:
      - "45600:45600"

    # 数据持久化
    volumes:
      # SQLite + 日志 + ncm-api 临时缓存 → 命名卷（由 docker 管理生命周期）
      - ./deen-data:/data
      # 下载文件 → 命名卷，便于备份/迁移。
      # 若希望直接在宿主机浏览音乐，可改为：
      #   - /path/on/host:/app/downloads
      - ./deen-downloads:/app/downloads
      - ./deen-logs:/app/logs
    # 环境变量（全部可选）
    environment:
      # 应用数据目录（与 Dockerfile 中 ENV APP_DATA_DIR=/data 保持一致，
      # 此处显式再写一遍便于后续修改默认位置）。
      APP_DATA_DIR: /data
      DATA_DIR: /data
      # 时区：日志时间戳 + APScheduler 触发时刻 + 数据库默认时间字段
      TZ: Asia/Shanghai
      # 访问令牌（强烈建议设置）：设置后所有页面与 /api/* 都需要令牌，
      # 浏览器首次访问 http://<host-ip>:45600/?token=<令牌> 后自动记住；
      # 导出账号、修改自定义 API 地址/下载目录/监听地址也只对持有令牌的访问开放
      # （容器内请求来自 docker 网桥，不算"本机"）
      # ACCESS_TOKEN: "please-change-me-to-a-long-random-string"
      # 自定义容器内 Web 监听地址（默认 0.0.0.0:45600，见 Dockerfile WEB_PORT_DEFAULT；
      # 改这里需要改 ports 一起）
      # WEB_PORT: "0.0.0.0:45600"

    # 健康检查镜像内 HEALTHCHECK — 这里仅覆写间隔/超时等可选参数
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:45600/healthz', timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # 资源限制（按需调整；默认值适合 NAS / 小型 VPS）
    deploy:
      resources:
        limits:
          # Flask 进程 + 三个 Go API 子进程 + 临时下载缓冲。
          # 三平台 API 高峰期合计可占 ~500 MB；这里给 1 GB 留余量。
          memory: 1G
        reservations:
          memory: 256M

    # 网络模式默认 bridge 即可；若与其他容器共享同一网络，可改为
    #   network_mode: "service:reverse-proxy"
    # 并删除 ports，由反代容器（如 caddy / nginx）对外暴露。

    # 日志（防止容器日志占满磁盘）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

