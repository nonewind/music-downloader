{% extends "base.html" %}
{% block title %}音乐整理 - Deen音乐下载器{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0"><i class="bi bi-collection"></i> 音乐整理</h4>
    <div class="d-flex gap-2 align-items-center">
        <span class="badge bg-secondary" id="organize-mode-badge" title="删除模式在「设置」中调整">模式加载中...</span>
        <button class="btn btn-primary" id="btn-scan">
            <i class="bi bi-search"></i> 扫描下载目录
        </button>
    </div>
</div>

<div class="alert alert-info">
    <i class="bi bi-info-circle"></i>
    扫描下载目录，识别重复文件与同歌曲多音质版本；每组选择要保留的文件后安全清理其余文件。
    <span class="d-block small text-muted mt-1" id="mode-hint">正在读取删除模式...</span>
</div>

<!-- 扫描摘要（扫描后显示） -->
<div class="alert alert-secondary d-none" id="scan-summary"></div>

<!-- 分组卡片列表 -->
<div id="group-list"></div>
<p class="text-muted text-center" id="empty-hint">尚未扫描，点击右上角「扫描下载目录」开始。</p>

<!-- 底部操作条（有分组时显示） -->
<div class="card mt-3 d-none" id="clean-bar">
    <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-2">
        <span class="text-muted" id="clean-count">待清理 0 个文件</span>
        <div class="d-flex gap-2">
            <button class="btn btn-warning" id="btn-clean-recommended" title="每组保留推荐文件（规格最高）">
                <i class="bi bi-stars"></i> 按推荐清理
            </button>
            <button class="btn btn-danger" id="btn-clean-selected" title="每组保留当前勾选项">
                <i class="bi bi-trash"></i> 按当前选择清理
            </button>
        </div>
    </div>
</div>

<!-- 清理结果区（清理后显示） -->
<div class="card mt-3 d-none" id="clean-result">
    <div class="card-header"><i class="bi bi-clipboard-check"></i> 清理结果</div>
    <div class="card-body" id="clean-result-body"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ static_v('js/organize.js') }}"></script>
{% endblock %}
